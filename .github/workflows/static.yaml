name: Static Tests

# ⚠️  ZENTRAL VERWALTETE DATEI — NICHT LOKAL ÄNDERN!
#
# Diese Datei wird aus cors-gmbh/shared-workflows-private per File-Sync verteilt
# (Quelle: templates/harness/static.yaml, Gruppe "Dev-Harness der Bundle-Repos").
# Lokale Änderungen werden beim nächsten Sync-Lauf per PR überschrieben.
#
# Voraussetzungen im Bundle-Repo: Dev-Harness (Kernel.php, bin/console, config/, .env mit
# DOCKER_PHP_VERSION), ecs.php, phpstan.neon, psalm.xml, var/classes/DataObject/.gitkeep und
# config/local/.gitkeep im Repo, sowie die Repository-Secrets PIMCORE_ENCRYPTION_SECRET,
# PIMCORE_INSTANCE_IDENTIFIER und PIMCORE_PRODUCT_KEY (registrierte CI-Instanz, Kennung = Repo-Name).
# Abweichende Repos (kein phpstan.neon, andere Lint-Pfade) gehören nicht in die Sync-Gruppe.

on:
  push:
    branches: [ '*.x', main ]
  pull_request:
    branches: [ '*.x', main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: cors-gmbh/shared-workflows/.github/workflows/php-test.yaml@main
    with:
      # single source of truth for the PHP version: DOCKER_PHP_VERSION in .env
      versions-from-env: true
      # pimcore stays on: PHPStan and the lints boot the Pimcore kernel, and php-test only writes the
      # registration from env_local to .env.local when the Pimcore steps are enabled.
      phpstan: true
      psalm: true
      lint-yaml-paths: 'config src/Resources/config'
    secrets:
      composer_auth: ${{ secrets.COMPOSER_AUTH }}
      # Pimcore refuses to boot without a registered instance; php-test writes this to .env.local.
      env_local: |
        PIMCORE_ENCRYPTION_SECRET=${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
        PIMCORE_INSTANCE_IDENTIFIER=${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
        PIMCORE_PRODUCT_KEY=${{ secrets.PIMCORE_PRODUCT_KEY }}
