services:
    CORS\Bundle\AdminerBundle\Controller\DefaultController:
        autowire: true
        autoconfigure: true
        public: true
        tags:
            - { name: controller.service_arguments }

    CORS\Bundle\AdminerBundle\EventListener\AdminJsListener:
        tags:
            - { name: kernel.event_subscriber }

    CORS\Bundle\AdminerBundle\Studio\WebpackEntryPointProvider:
        public: false
        # BuildArchiveExtractionTrait's #[Required] setter, called explicitly in case the
        # service is not autowired
        calls:
            - [setBuildArchiveExtractor, ['@Pimcore\Bundle\StudioUiBundle\Build\BuildArchiveExtractor']]
        tags:
            - { name: pimcore_studio_ui.webpack_entry_point_provider }
